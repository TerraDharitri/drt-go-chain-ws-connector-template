name: Build

on:
  pull_request:
    branches: [main, feat/*, dev]
    types: [opened, ready_for_review]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.23.6
      - name: Build
        run: go build -v ./...
